<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: gray;
            font-size: medium;
        }
        .container {
            
            position: relative;
            width: 280px;
            height: 500px;
            border: 0px solid rgb(0, 0, 0);
            box-shadow: 0px 0px 3px rgb(216, 216, 217);
            border-radius: 5px;
            padding: 7px;
        }

        img {
            width: 280px;
            height: 280px;
            border-radius: 5px;
        }
        .spn {
            margin-top: 10px;
        }
        span {
            border: 0px solid gray;
            box-shadow: 0px 0px 2px rgb(214, 213, 213);
            padding: 3px;
            margin-left: 10px;
            border-radius: 15px;
        }
        p {
            float: left;
            margin-top: -10px;
        }
        button {
            cursor:grab;
            align-items: center;
            margin-left: 80px;
            margin-bottom: 10px;
            padding: 9px;
            border-radius: 20px;
            width: 100px;
            border: 0px solid ;
            color: blue;
            background-color: rgb(220, 220, 247);
        }

        h1{
            font-style: oblique;
            color: gray;
            font-size: x-large;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://cdn.discordapp.com/attachments/1159960188825120819/1167301787322163261/OIG_1.jpeg" alt="">
        <div class="spn"><span>Anime Edit</span><span>CGI Edit</span></div>
        <h1>Anime Edit</h1>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Velit cumque quos eaque maxime nihil unde ipsam
            provident, quia distinctio est.</p>
        <button>Read More</button>
    </div>
</body>

</html>
