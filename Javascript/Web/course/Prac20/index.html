<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
    <style>

        /* difference between fixed and sticky */

        /* transform, filter or perspective can also make an element appear as positioned */
        
        * {
            margin: 0;
            padding: 0;
        }

        .box1 {
            background-color: aqua;
            /* position: absolute; */
            position: sticky;
            top: 0px;
            /* nearest position ancestor ke relative lagta hai, in this case it's parent, if parent isnt absolute then it's according to HTML */
        }

        .box2 {
            background-color: pink;
            position: relative;
            top: 34px;
            left: 56px;
        }

        .box3 {
            background-color: yellow;
            /* position: fixed; */
            /* It is stuck at one place */
        }

        .box4 {
            background-color: orange;
        }

        .box {
            height: 133px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }
        .parent{
            padding: 43px;
            margin: 34px;
            border: 2px solid purple;
            position: absolute;
            /* if we do position absolute here, then box1 will be according to this and not HTML */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
