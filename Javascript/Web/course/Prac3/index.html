<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Random trains here lmao"> <!-- description of the page-->
    

    <title>Image</title><!-- image title -->
    <link rel="stylesheet" href="style.css"><!-- CSS file link-->
</head>

<body>
    <h1>Indian Railways : Trains</h1>
    <h3> Images</h3>
    <img width="420" src="train.png" alt="Train image"><!-- train image -->
    <h3> Tables</h3>
    <table>
        <caption>Train Details</caption>
        <thead> <!-- HEAD -->
            <tr>
                <th> Train Name</th>
                <th> Train Number</th>
            </tr>
        </thead>
        <tbody> <!-- BODY -->
            <tr>
                <td>Puri Rourkela Vande Bharat</td>
                <td>001</td>
            </tr>
            <tr>
                <td>Bhubaneswar LTT SuperFast Exp.</td>
                <td>002</td>
            </tr>
        </tbody>
        <tfoot> <!-- FOOTER -->
            <tr>
                <td>Kanyakumari Dibrugarh SuperFast Exp.</td>
                <td>003</td>
            </tr>
        </tfoot>
    </table>

    <h3>
        Lists
    </h3>

    <h5>
        Unordered:
    </h5>

    <ul><!-- can be customized using type attribute -> circle, disc, square -->
        <li>Shrey</li>
        <li>Anshu</li>
        <li>Rey</li>
    </ul>

    <h5>
        Ordered:
    </h5>

    <ol><!-- type -> I, i, 1, a, A -->
        <li>One Shrey</li>
        <li>Two Shreys</li>
        <li>Three Shreys</li>
    </ol>
</body>

</html>
