<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>

<body class="bg-gradient">
    <div class="container">
        <h1 style="text-align: center;">Welcome to Shreyy</h1>
        <h2 style="text-align: center;">This is just a sample website built for fun and for learning basic HTML</h2>
        <form style="padding: 5px; margin: 10px;" class="inp">
            First Name: <input type="text" name="firstname" /> <br />
            Last Name: <input type="text" name="lastname" /> <br />
            Email Address: <input type="email" name="email" /> <br />
            Phone Number: <input type="number" name="phone" /> <br />
            Instagram Id: <input type="text" name="instagram" /> <br />
            <button class="btn" type="button">Login</button>
        </form>
    </div>
</body>

</html>
