<script>
    //old way
    const requestUrl = 'https://api.github.com/users/shreyanshumis'
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState);
        if(xhr.readyState === 4){
            const data = JSON.parse(this.responseText)//converts this into JSON since the by default response is string and not an Object
            console.log(data);
            console.log(typeof data);
            console.log(data.followers);//this won't work unless u convert data into JSON
            console.log(data.avatar_url);//this won't work unless u convert data into JSON
            
        }
    }
    xhr.send(); 
</script>
